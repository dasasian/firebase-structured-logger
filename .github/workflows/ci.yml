name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 22 is the supported floor (`engines`, firebase-admin 14 and Storage 8
        # all require it) and 24 is the current LTS. Node 20 was dropped at 1.0:
        # it reached end of life on 2026-04-30 and gets no security fixes.
        # If you change this, update the required status checks on `main`, or
        # PRs wait forever on a check that never runs.
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      # The packed tarball, installed with no optional peers, under both Storage
      # majors the package accepts. Needs the npm registry and nothing else.
      - run: npm run smoke:install
