version: 2

# Grouped and monthly on purpose: a weekly stream of single-package PRs is the
# version people train themselves to ignore. Security advisories are raised
# immediately regardless of this schedule.
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns:
          - "*"
    ignore:
      # TypeScript majors are migrations, not routine bumps, and grouped updates are
      # all-or-nothing, so a major here blocks every other package behind it. The
      # build is on 6.x on purpose: 7.0 has no programmatic API until 7.1, which
      # tools like typescript-eslint and typedoc need. Moving to 7 is tracked in its
      # own issue — a one-line bump, since the config already uses node16.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  # These workflows publish to npm, so a stale action here is a supply-chain
  # concern rather than a convenience one.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"
